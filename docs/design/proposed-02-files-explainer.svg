  <g class="ui">
    <text x="312" y="112" class="tiny muted">src / payments / <tspan fill="#e9eef3">processor.py</tspan></text><text x="1018" y="112" text-anchor="end" class="tiny green">SOURCE VERIFIED · main</text><path d="M302 130H1030" class="line"/>
    <text x="318" y="164" class="code dim"> 76</text><text x="363" y="164" class="code"><tspan fill="#93c8ff">class</tspan> PaymentProcessor:</text>
    <text x="318" y="196" class="code dim"> 77</text><text x="363" y="196" class="code">    <tspan fill="#93c8ff">def</tspan> __init__(self, provider, retry):</text>
    <text x="318" y="228" class="code dim"> 78</text><text x="363" y="228" class="code">        self.provider = provider</text>
    <text x="318" y="260" class="code dim"> 79</text><text x="363" y="260" class="code">        self.retry = retry</text>
    <text x="318" y="292" class="code dim"> 80</text><text x="363" y="292" class="code"> </text>
    <text x="318" y="324" class="code dim"> 81</text><text x="363" y="324" class="code">    <tspan fill="#93c8ff">def</tspan> process(self, command):</text>
    <text x="318" y="356" class="code dim"> 82</text><text x="363" y="356" class="code">        charge = self.retry.execute(</text>
    <text x="318" y="388" class="code dim"> 83</text><text x="363" y="388" class="code">            <tspan fill="#93c8ff">lambda</tspan>: self.provider.charge(</text>
    <text x="318" y="420" class="code dim"> 84</text><text x="363" y="420" class="code">                amount=command.amount,</text>
    <text x="318" y="452" class="code dim"> 85</text><text x="363" y="452" class="code">                currency=command.currency,</text>
    <text x="318" y="484" class="code dim"> 86</text><text x="363" y="484" class="code">                idempotency_key=command.key,</text>
    <text x="318" y="516" class="code dim"> 87</text><text x="363" y="516" class="code">            )</text>
    <rect x="307" y="529" width="729" height="96" rx="7" fill="#32422d" opacity=".62"/><rect x="307" y="529" width="3" height="96" fill="#c3f278"/>
    <text x="318" y="552" class="code dim"> 88</text><text x="363" y="552" class="code green">        payment = Payment(</text>
    <text x="318" y="584" class="code dim"> 89</text><text x="363" y="584" class="code">            id=charge.id, amount=charge.amount,</text>
    <text x="318" y="616" class="code dim"> 90</text><text x="363" y="616" class="code">            status=charge.status, provider_ref=charge.ref,</text>
    <text x="318" y="648" class="code dim"> 91</text><text x="363" y="648" class="code">        )</text>
    <text x="318" y="680" class="code dim"> 92</text><text x="363" y="680" class="code">        self._emit_payment_succeeded(payment)</text>
    <text x="318" y="712" class="code dim"> 93</text><text x="363" y="712" class="code">        <tspan fill="#93c8ff">return</tspan> payment</text>
    <text x="318" y="776" class="small muted">Selected explanation: lines 88–93</text><text x="318" y="806" class="tiny dim">Click a sentence or line range to see why it matters.</text>
  </g>
  <rect x="1050" y="76" width="390" height="824" fill="#151c24"/>
  <g class="ui">
    <text x="1080" y="116" class="label green">THIS FILE</text><text x="1080" y="151" class="title">PaymentProcessor</text><text x="1080" y="178" class="small muted">src/payments/processor.py</text>
    <rect x="1078" y="202" width="334" height="132" rx="12" fill="#1c252d" stroke="#33404a"/><text x="1098" y="232" class="label muted">IN ONE SENTENCE</text><text x="1098" y="261" class="body">Turns a payment request into a</text><text x="1098" y="283" class="body">provider charge, then records the</text><text x="1098" y="305" class="body">successful result.</text>
    <text x="1080" y="373" class="label muted">HOW IT WORKS</text>
    <circle cx="1091" cy="408" r="12" fill="#28352b"/><text x="1091" y="413" text-anchor="middle" class="tiny green">1</text><text x="1115" y="405" class="small">Retries the provider charge</text><text x="1115" y="426" class="tiny muted">Keeps one idempotency key</text><text x="1388" y="416" text-anchor="end" class="tiny blue">lines 82–87 ↗</text>
    <circle cx="1091" cy="469" r="12" fill="#28352b"/><text x="1091" y="474" text-anchor="middle" class="tiny green">2</text><text x="1115" y="466" class="small">Creates the Payment record</text><text x="1115" y="487" class="tiny muted">Uses the returned charge</text><text x="1388" y="477" text-anchor="end" class="tiny blue">lines 88–91 ↗</text>
    <circle cx="1091" cy="530" r="12" fill="#28352b"/><text x="1091" y="535" text-anchor="middle" class="tiny green">3</text><text x="1115" y="527" class="small">Emits success and returns</text><text x="1115" y="548" class="tiny muted">Only after the record exists</text><text x="1388" y="538" text-anchor="end" class="tiny blue">lines 92–93 ↗</text>
    <path d="M1080 579H1410" class="line"/><text x="1080" y="613" class="label muted">CONNECTED FILES</text>
