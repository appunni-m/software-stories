<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Proposed Code Atlas first-run screen</title>
  <desc id="desc">A calm welcome screen with one next action and a plain explanation of the three-step local workflow.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#151c24"/><stop offset="1" stop-color="#10151b"/></linearGradient>
    <linearGradient id="hero" x2="1" y2="1"><stop stop-color="#1d2a34"/><stop offset="1" stop-color="#182229"/></linearGradient>
    <style>
      .ui{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e9eef3}.muted{fill:#9aa8b5}.dim{fill:#72808d}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.label{font-size:11px;font-weight:700;letter-spacing:1px}.title{font-size:36px;font-weight:650}.green{fill:#c3f278}.blue{fill:#83c6ff}.line{stroke:#2c3742}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="76" fill="#11171e"/><path d="M0 75.5H1440" class="line"/>
  <g class="ui"><rect x="40" y="22" width="31" height="31" rx="9" fill="#263637"/><path d="M49 43V32h12v11M46 43h18" fill="none" stroke="#c3f278" stroke-width="2" stroke-linecap="round"/><text x="81" y="43" font-size="18" font-weight="700">Code Atlas</text><circle cx="1370" cy="38" r="18" fill="#202a32" stroke="#35414b"/><text x="1370" y="43" text-anchor="middle" class="small muted">⚙</text></g>
  <g class="ui">
    <text x="166" y="172" class="label green">A CLEARER WAY INTO A CODEBASE</text>
    <text x="166" y="223" class="title">Make this repository</text><text x="166" y="266" class="title">make sense.</text>
    <text x="166" y="307" class="body muted">See what each file does, follow how the pieces connect,</text><text x="166" y="331" class="body muted">and check every explanation against the actual code.</text>
    <rect x="166" y="369" width="218" height="52" rx="10" fill="#c3f278"/><path d="M189 395h18m-7-7 7 7-7 7" fill="none" stroke="#172018" stroke-width="1.8"/><text x="222" y="401" class="small" fill="#172018" font-weight="650">Open a repository</text>
    <text x="166" y="455" class="small muted">Start with any local folder. You choose when source is read.</text>
    <rect x="166" y="503" width="682" height="232" rx="17" fill="url(#hero)" stroke="#394853"/>
    <text x="196" y="541" class="label muted">HOW IT WORKS</text>
    <circle cx="211" cy="594" r="17" fill="#28352b"/><text x="211" y="599" text-anchor="middle" class="small green" font-weight="700">1</text><text x="246" y="590" class="small" font-weight="650">Choose your folder</text><text x="246" y="612" class="tiny muted">Pick the repository on this Mac.</text>
    <circle cx="211" cy="656" r="17" fill="#24313a"/><text x="211" y="661" text-anchor="middle" class="small blue" font-weight="700">2</text><text x="246" y="652" class="small" font-weight="650">Save a source version</text><text x="246" y="674" class="tiny muted">Review capture limits before creating a local snapshot.</text>
    <circle cx="211" cy="718" r="17" fill="#303027"/><text x="211" y="723" text-anchor="middle" class="small" fill="#e5c97b" font-weight="700">3</text><text x="246" y="714" class="small" font-weight="650">Explore at your pace</text><text x="246" y="736" class="tiny muted">Start with a file, a guide, or a change.</text>
    <rect x="886" y="169" width="388" height="566" rx="18" fill="#171f27" stroke="#303b46"/>
    <rect x="917" y="201" width="48" height="48" rx="13" fill="#28352b"/><path d="M932 212v26l20-13z" fill="#c3f278"/>
    <text x="917" y="288" class="label muted">A GOOD PLACE TO BEGIN</text><text x="917" y="326" font-size="23" font-weight="650">Take a short repo tour</text><text x="917" y="354" class="small muted">When a guide is ready, it walks through real code</text><text x="917" y="375" class="small muted">one section at a time.</text>
    <path d="M917 408H1242" class="line"/><text x="917" y="445" class="label muted">THEN CHOOSE YOUR NEXT STEP</text>
    <circle cx="929" cy="482" r="6" fill="#83c6ff"/><text x="948" y="487" class="small">Open any file to see what it does</text>
    <circle cx="929" cy="526" r="6" fill="#83c6ff"/><text x="948" y="531" class="small">Follow a source link to its exact lines</text>
    <circle cx="929" cy="570" r="6" fill="#e5c97b"/><text x="948" y="575" class="small">Compare versions to see what changed</text>
    <path d="M917 612H1242" class="line"/><text x="917" y="649" class="small green">Your code stays on this Mac while browsing.</text><text x="917" y="672" class="tiny muted">No model or account is needed to open and browse.</text>
    <rect x="166" y="787" width="1108" height="1" fill="#2c3742"/><circle cx="180" cy="823" r="5" fill="#c3f278"/><text x="197" y="828" class="small muted">Nothing is captured until you review and choose Create snapshot.</text><text x="1274" y="828" text-anchor="end" class="tiny dim">Local first · Evidence linked to source</text>
  </g>
</svg>
