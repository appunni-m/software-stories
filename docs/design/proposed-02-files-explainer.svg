    <rect x="1080" y="685" width="330" height="45" rx="8" fill="#1b242c"/><text x="1096" y="713" class="small blue">retry.py</text><text x="1389" y="713" text-anchor="end" class="tiny muted">execute() ↗</text>
    <text x="1080" y="777" class="tiny muted">Every link opens the exact source lines.</text>
