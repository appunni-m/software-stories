    <style>
      .ui{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e9eef3}.muted{fill:#9aa8b5}.dim{fill:#72808d}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.label{font-size:11px;font-weight:700;letter-spacing:1px}.title{font-size:21px;font-weight:650}.code{font-family:Menlo,Monaco,monospace;font-size:14px}.line{stroke:#2c3742}.green{fill:#c3f278}.blue{fill:#83c6ff}
    </style>
  </defs>
