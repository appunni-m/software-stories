<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Proposed Code Atlas Guide home</title>
  <desc id="desc">A simplified repository guide with three clear destinations: Guide, Files, and Changes.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#151c24"/><stop offset="1" stop-color="#10151b"/></linearGradient>
    <linearGradient id="hero" x2="1" y2="1"><stop stop-color="#1d2a34"/><stop offset="1" stop-color="#182229"/></linearGradient>
    <style>
      .ui{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e9eef3}.muted{fill:#9aa8b5}.dim{fill:#738190}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.label{font-size:12px;font-weight:700;letter-spacing:1.1px}.title{font-size:30px;font-weight:650}.cardtitle{font-size:18px;font-weight:620}.line{stroke:#2c3742}.green{fill:#c3f278}.blue{fill:#83c6ff}.button{font-size:14px;font-weight:650}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="76" fill="#11171e"/>
  <path d="M0 75.5H1440" class="line"/>
  <g class="ui">
    <rect x="32" y="22" width="31" height="31" rx="9" fill="#263637"/><path d="M41 43V32h12v11M38 43h18" fill="none" stroke="#c3f278" stroke-width="2" stroke-linecap="round"/>
    <text x="73" y="43" font-size="18" font-weight="700">Code Atlas</text>
    <rect x="254" y="16" width="287" height="44" rx="10" fill="#1a222a" stroke="#303b46"/>
    <circle cx="275" cy="38" r="5" fill="#c3f278"/><text x="291" y="35" class="small" font-weight="650">payments-service</text><text x="291" y="51" class="tiny muted">main · captured today</text><path d="M517 35l5 5 5-5" fill="none" stroke="#9aa8b5" stroke-width="1.7"/>
    <g font-size="14" font-weight="600">
      <rect x="585" y="13" width="106" height="48" rx="9" fill="#28352b"/><text x="638" y="43" text-anchor="middle" class="green">Guide</text>
      <text x="759" y="43" text-anchor="middle" class="muted">Files</text><text x="871" y="43" text-anchor="middle" class="muted">Changes</text>
    </g>
    <rect x="1122" y="17" width="202" height="42" rx="9" fill="#1a222a" stroke="#303b46"/><circle cx="1143" cy="37" r="6" fill="none" stroke="#97a5b1" stroke-width="1.5"/><path d="M1147 42l5 5" stroke="#97a5b1" stroke-width="1.5"/><text x="1160" y="42" class="small muted">Find a file</text><text x="1303" y="42" class="tiny dim">⌘K</text>
    <circle cx="1376" cy="38" r="18" fill="#202a32" stroke="#35414b"/><path d="M1376 29v2m0 14v2m-9-9h2m14 0h2m-15.5-6.5 1.5 1.5m10 10 1.5 1.5m0-13-1.5 1.5m-10 10-1.5 1.5" stroke="#b5c1ca" stroke-width="1.5" stroke-linecap="round"/><circle cx="1376" cy="38" r="4" fill="none" stroke="#b5c1ca" stroke-width="1.5"/>
  </g>
  <g class="ui">
    <text x="88" y="138" class="label green">YOUR REPOSITORY GUIDE</text>
    <text x="88" y="181" class="title">Understand this codebase</text>
    <text x="88" y="211" class="body muted">Start with a short tour. Open any file when you want the exact code behind it.</text>
    <rect x="88" y="248" width="820" height="288" rx="18" fill="url(#hero)" stroke="#394853"/>
    <rect x="118" y="279" width="46" height="46" rx="13" fill="#2c3b30"/><path d="M137 290v24l19-12z" fill="#c3f278"/>
    <text x="184" y="293" class="label muted">START HERE · ABOUT 4 MINUTES</text>
    <text x="184" y="329" font-size="24" font-weight="650">How a payment moves through the app</text>
    <text x="184" y="359" class="body muted">Follow one real request from the API route to the saved payment.</text>
    <rect x="184" y="389" width="139" height="44" rx="9" fill="#c3f278"/><text x="253" y="416" text-anchor="middle" class="button" fill="#172018">Start the tour</text>
    <text x="344" y="416" class="small muted">5 sections</text><circle cx="428" cy="410" r="2" fill="#738190"/><text x="444" y="416" class="small muted">Pause or skip anytime</text>
    <g transform="translate(119 462)">
      <rect width="758" height="48" rx="11" fill="#151d24" stroke="#2f3b45"/>
      <circle cx="25" cy="24" r="7" fill="#83c6ff"/><circle cx="272" cy="24" r="7" fill="#c3f278"/><circle cx="519" cy="24" r="7" fill="#a98df4"/>
      <path d="M38 24h215m13 0h239" stroke="#657583" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="49" y="29" class="small">API request</text><text x="296" y="29" class="small">Payment processor</text><text x="543" y="29" class="small">Saved payment</text>
    </g>
    <rect x="936" y="248" width="416" height="288" rx="18" fill="#171f27" stroke="#303b46"/>
    <text x="966" y="285" class="cardtitle">File explanations</text><text x="966" y="310" class="small muted">See what is covered and pick up where you left off.</text>
    <text x="966" y="355" class="small">Explained files</text><text x="1317" y="355" text-anchor="end" font-size="20" font-weight="650">63 <tspan class="muted" font-size="14">/ 84</tspan></text>
    <rect x="966" y="369" width="356" height="8" rx="4" fill="#303a43"/><rect x="966" y="369" width="267" height="8" rx="4" fill="#c3f278"/>
    <text x="966" y="413" class="label muted">NEXT FILES TO EXPLORE</text>
    <circle cx="974" cy="440" r="4" fill="#83c6ff"/><text x="990" y="445" class="small">src/payments/retry.py</text><path d="M1304 440l5 5 5-5" fill="none" stroke="#81909d" stroke-width="1.5"/>
    <circle cx="974" cy="474" r="4" fill="#83c6ff"/><text x="990" y="479" class="small">src/webhooks/handler.py</text><path d="M1304 474l5 5 5-5" fill="none" stroke="#81909d" stroke-width="1.5"/>
    <text x="966" y="516" class="small green">Browse all files →</text>
    <text x="88" y="599" class="label muted">WHAT WOULD YOU LIKE TO DO?</text>
    <rect x="88" y="622" width="402" height="152" rx="15" fill="#171f27" stroke="#303b46"/>
    <rect x="112" y="647" width="38" height="38" rx="10" fill="#24313a"/><path d="M123 659h16m-16 6h16m-16 6h10" stroke="#83c6ff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="166" y="662" class="cardtitle">Find out what a file does</text><text x="166" y="689" class="small muted">Browse the source with a plain-language explanation.</text><text x="112" y="745" class="small blue">Open Files <tspan>→</tspan></text>
    <rect x="510" y="622" width="402" height="152" rx="15" fill="#171f27" stroke="#303b46"/>
    <rect x="534" y="647" width="38" height="38" rx="10" fill="#303027"/><path d="M545 656h16v16h-16zM550 652v4m6-4v4m-10 4h16" fill="none" stroke="#e5c97b" stroke-width="1.6"/>
    <text x="588" y="662" class="cardtitle">See what changed</text><text x="588" y="689" class="small muted">Compare two local revisions and trace affected code.</text><text x="534" y="745" class="small" fill="#e5c97b">Review changes <tspan>→</tspan></text>
    <rect x="936" y="622" width="416" height="152" rx="15" fill="#171f27" stroke="#303b46"/>
    <text x="966" y="661" class="label muted">CURRENT SNAPSHOT</text><text x="966" y="694" class="body">main · captured just now</text><text x="966" y="721" class="small muted">183 files · local on this Mac</text><text x="966" y="755" class="small green">Choose another snapshot</text>
    <text x="88" y="838" class="tiny dim">No source is read until you create a snapshot. No AI request is made from this screen.</text>
  </g>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7" fill="none" stroke="#657583" stroke-width="1.2"/></marker></defs>
</svg>
