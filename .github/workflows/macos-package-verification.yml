name: macOS package verification

on:
  pull_request:
  push:
    branches:
      - main
    # These files are not copied into the app bundle. Do not let user/contributor
    # docs occupy the branch's single pending package-input verification run.
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/macos-package-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-verification-${{ github.event.pull_request.number || github.ref }}
  # Native macOS builds can take a while. Preserve the active verification and
  # let GitHub retain only the newest pending run for this branch/PR.
  cancel-in-progress: false

jobs:
  verify-unsigned-package:
    name: Build and inspect unsigned bundles
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # The scope check compares the full push range or the pull request's
          # exact base/head commits. Missing history must never make us skip a build.
          fetch-depth: 0

      - name: Determine whether package inputs changed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run; package verification is required."
            echo "verify=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE"
            head="$PUSH_HEAD"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PULL_BASE"
            head="$PULL_HEAD"
          else
            echo "Unknown event; package verification is required."
            echo "verify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "Could not inspect the complete change range; package verification is required."
            echo "verify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" "$head" -- . \
            ':(exclude)docs/**' \
            ':(exclude).gitignore' \
            ':(exclude)README.md' \
            ':(exclude)CONTRIBUTING.md' \
            ':(exclude)SECURITY.md' \
            ':(exclude).github/workflows/macos-package-verification.yml'; then
            echo "Only reader documentation, repository ignore rules, or package-workflow configuration changed; skipping the native package build."
            echo "verify=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package inputs changed or the diff check failed; package verification is required."
            echo "verify=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.scope.outputs.verify == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        if: steps.scope.outputs.verify == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust dependency cache
        if: steps.scope.outputs.verify == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          add-job-id-key: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned license inventory tool
        if: steps.scope.outputs.verify == 'true'
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about --version

      - name: Install JavaScript dependencies
        if: steps.scope.outputs.verify == 'true'
        run: npm ci

      - name: Build and inspect unsigned macOS bundles
        if: steps.scope.outputs.verify == 'true'
        run: npm run bundle:macos
