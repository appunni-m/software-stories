[package]
name = "code-atlas-desktop"
version = "0.1.0"
description = "A local-first guide to understanding software repositories"
authors = ["Code Atlas contributors"]
edition = "2024"
default-run = "code-atlas-desktop"

[lib]
name = "code_atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = { version = "0.10", features = ["asm"] }
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
libc = "0.2"
grep-matcher = "=0.1.9"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
jsonschema = { version = "=0.59.0", default-features = false }
tantivy = { version = "=0.26.2", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rig-core = { version = "=0.44.0", default-features = false, features = ["reqwest", "rustls"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = { version = "0.10", features = ["asm"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tree-sitter = "=0.27.1"
tree-sitter-go = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tokio = { version = "1", features = ["macros", "sync", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

# Runtime identity is checked before each admitted tool result. Keep the
# existing streaming SHA-256 checks responsive in development and test builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
