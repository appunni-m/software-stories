<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Proposed Code Atlas Files screen</title>
  <desc id="desc">A single file browser combines exact source code, a short explanation, and clickable evidence.</desc>
  <defs>
